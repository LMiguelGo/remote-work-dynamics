services:
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: analytics
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-rwd_database}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - CORS_ORIGINS=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
    depends_on:
      - database
    restart: unless-stopped
    networks:
      - app-network

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: database
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-rwd_database}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@database:5432/${POSTGRES_DB:-rwd_database}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      - MQTT_URL=mqtt://broker-mqtt:1883
      - INGEST_TOKEN=${INGEST_TOKEN:-dev_ingest_token}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
    restart: unless-stopped
    depends_on:
      - database
      - broker-mqtt
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  broker-mqtt:
    build:
      context: ./broker-mqtt
      dockerfile: Dockerfile
    container_name: broker-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
