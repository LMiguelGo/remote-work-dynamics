services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-rwd_database}
    volumes:
      - ./database/data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@database:5432/${POSTGRES_DB:-rwd_database}
      - MQTT_URL=mqtt://broker-mqtt:1883
      - INGEST_TOKEN=${INGEST_TOKEN:-dev_ingest_token}
    restart: unless-stopped
    depends_on:
      - database
      - broker-mqtt
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  broker-mqtt:
    build:
      context: ./broker-mqtt
      dockerfile: Dockerfile
    container_name: broker-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
