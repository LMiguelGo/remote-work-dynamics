services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80" # Tráfico HTTP para renovación de SSL
      - "443:443" # Tráfico HTTPS y WSS
      - "81:81" # Panel de administración web de NPM
      - "8883:8883" # Conexión broker MQTT
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - app-network

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: analytics
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-rwd_database}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - CORS_ORIGINS=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      - database
    restart: unless-stopped
    networks:
      - app-network

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-rwd_database}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@database:5432/${POSTGRES_DB:-rwd_database}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      - MQTT_URL=mqtt://broker-mqtt:1883
      - INGEST_TOKEN=${INGEST_TOKEN:-dev_ingest_token}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-dev_github_secret}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - JIRA_STORY_POINTS_FIELD=${JIRA_STORY_POINTS_FIELD:-customfield_10016}
    restart: unless-stopped
    depends_on:
      - database
      - broker-mqtt
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  broker-mqtt:
    build:
      context: ./broker-mqtt
      dockerfile: Dockerfile
    container_name: broker-mqtt
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
